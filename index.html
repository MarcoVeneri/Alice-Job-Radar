<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#111521" media="(prefers-color-scheme:dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alice Jobs">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Alice Job Radar</title>
<script src="./config.js"></script>
<style>
:root{--bg:#f5f6fb;--bg2:#edf1f8;--panel:rgba(255,255,255,.78);--solid:#fff;--ink:#121a2d;--muted:#768099;--line:rgba(126,139,170,.18);--accent:#776bf8;--accent2:#958aff;--soft:rgba(119,107,248,.11);--blue:#4b86ef;--gold:#efad58;--chip:#eef1f6;--btn:#243756;--shadow:0 14px 34px rgba(43,57,89,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#101521;--bg2:#161c2a;--panel:rgba(25,31,44,.82);--solid:#1b2130;--ink:#f7f9fd;--muted:#a0a9bb;--line:rgba(255,255,255,.10);--accent:#968bff;--accent2:#afa7ff;--soft:rgba(150,139,255,.16);--blue:#79a8ff;--gold:#f0bd72;--chip:#232a3b;--btn:#263651;--shadow:0 16px 38px rgba(0,0,0,.28)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 92% 6%,rgba(137,126,255,.18),transparent 24%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:max(14px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
button,input,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto}
.hero{position:relative;min-height:155px;padding:12px 2px 0}.kicker{font-size:13px;font-weight:700;color:var(--muted)}h1{font-size:35px;line-height:1;letter-spacing:-.05em;margin:9px 0 7px;position:relative;z-index:2}.sub{font-size:12px;color:var(--muted);position:relative;z-index:2}.bubble,.bubble2{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(10px)}.bubble{right:80px;top:3px;width:120px;height:120px;background:linear-gradient(145deg,rgba(135,123,255,.25),rgba(255,255,255,.08))}.bubble2{right:8px;top:44px;width:140px;height:140px;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(199,204,255,.08))}.heroNote{position:absolute;right:17px;top:70px;width:112px;font-size:11px;line-height:1.18;color:#6d7798;z-index:2}.heroNote:after{content:"";display:block;width:26px;height:2px;background:currentColor;opacity:.45;margin-top:8px}.refresh{position:absolute;right:0;top:6px;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.38);box-shadow:var(--shadow);color:var(--ink);z-index:3}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.tab{height:46px;border:0;border-radius:18px;background:transparent;color:#5f6984;font-size:12px;font-weight:800}.tab.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 18px rgba(119,107,248,.22)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:15px 0}.stat{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:12px;padding:14px;border-radius:26px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.si{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:24px}.stat:nth-child(2) .si{color:var(--gold);background:rgba(239,173,88,.13)}.stat:nth-child(3) .si{color:var(--blue);background:rgba(75,134,239,.12)}.sl{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:25px;line-height:1;font-weight:850;margin-top:3px}
.tools{display:grid;gap:8px;margin-bottom:13px}.search{height:43px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:var(--shadow)}.search input{border:0;outline:0;background:transparent;color:var(--ink);width:100%;font-size:14px}.quick{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.mini{flex:0 0 auto;height:38px;padding:0 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;font-weight:800}.mini.active{color:var(--accent);background:var(--soft)}
.notice{display:none;margin-bottom:12px;padding:11px 13px;border-radius:15px;border:1px solid rgba(239,173,88,.25);background:rgba(239,173,88,.10);color:#b46c16;font-size:11px}.notice.show{display:block}.jobs{display:grid;gap:14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.68));border:1px solid rgba(118,132,166,.24);outline:1px solid rgba(255,255,255,.42);border-radius:28px;padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
@media(prefers-color-scheme:dark){.card{background:linear-gradient(180deg,rgba(28,34,48,.94),rgba(23,29,42,.88));outline-color:rgba(255,255,255,.04)}}.card.topmatch{border-color:rgba(119,107,248,.34)}
.head{display:grid;grid-template-columns:78px 1fr auto;gap:13px;align-items:start}.logo{width:78px;height:78px;border-radius:22px;background:var(--solid);border:1px solid var(--line);display:grid;place-items:center;text-align:center;font-weight:900;color:var(--accent);font-size:16px;box-shadow:0 8px 22px rgba(43,57,89,.06)}.company{font-size:13px;color:var(--muted);margin-top:4px}.title{font-size:21px;font-weight:850;line-height:1.08;letter-spacing:-.03em;margin:4px 0 6px}.loc{font-size:12px;color:var(--muted)}.side{display:flex;flex-direction:column;gap:10px;align-items:flex-end}.score{height:34px;min-width:72px;padding:0 11px;border-radius:999px;background:var(--solid);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;font-weight:850}.score b{color:var(--gold)}.status{height:36px;max-width:130px;border-radius:999px;border:1px solid var(--line);background:var(--solid);color:var(--accent);padding:0 11px;font-size:11px;font-weight:800;outline:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 8px 91px}.tag{padding:7px 12px;border-radius:999px;background:var(--chip);border:1px solid rgba(120,132,160,.10);font-size:11px;font-weight:700;color:#5e6984}.summary{margin-left:91px;color:#616c87;font-size:13px;line-height:1.42}.checks{margin:8px 0 0 91px;color:var(--muted);font-size:10px}.checks b{color:var(--ink)}.bottom{display:flex;justify-content:flex-end;margin-top:12px}.open{height:48px;padding:0 18px;border-radius:17px;background:linear-gradient(135deg,var(--btn),#1d2a46);color:white;text-decoration:none;display:inline-flex;align-items:center;font-size:13px;font-weight:800;box-shadow:0 10px 22px rgba(29,42,70,.20)}
.nav{position:sticky;bottom:max(6px,env(safe-area-inset-bottom));margin-top:16px;padding:8px 10px;border-radius:26px;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.55);box-shadow:var(--shadow);backdrop-filter:blur(18px)}@media(prefers-color-scheme:dark){.nav{background:rgba(24,30,43,.84);border-color:rgba(255,255,255,.08)}}.navgrid{display:grid;grid-template-columns:repeat(4,1fr)}.navitem{display:grid;justify-items:center;gap:3px;padding:6px 0;color:#69738d;font-size:10px;font-weight:700}.navitem span:first-child{font-size:20px}.navitem.active{color:var(--accent)}.footer{text-align:center;color:var(--muted);font-size:9px;margin-top:10px}
@media(max-width:600px){h1{font-size:31px}.stats{gap:8px}.stat{grid-template-columns:44px 1fr;padding:12px;border-radius:21px}.si{width:44px;height:44px;border-radius:16px;font-size:20px}.head{grid-template-columns:62px 1fr;grid-template-areas:"logo info" "logo side"}.logo{grid-area:logo;width:62px;height:62px;border-radius:18px;font-size:13px}.info{grid-area:info}.side{grid-area:side;flex-direction:row;align-items:center;justify-content:flex-start}.meta,.summary,.checks{margin-left:0}.bottom{justify-content:stretch}.open{width:100%;justify-content:center}}
@media(max-width:430px){.stats{grid-template-columns:1fr}.bubble{right:60px;width:90px;height:90px}.bubble2{width:104px;height:104px}.heroNote{right:8px;top:68px;width:88px;font-size:9px}.refresh{width:48px;height:48px}}
</style>
</head>
<body>
<main class="app">
<section class="hero">
<div class="bubble"></div><div class="bubble2"></div>
<div class="kicker">Ricerca automatica</div>
<h1>Alice Job Radar</h1>
<div id="updated" class="sub">Ultimo aggiornamento: caricamento…</div>
<div class="heroNote">Nuove opportunità ti aspettano</div>
<button id="refresh" class="refresh" aria-label="Aggiorna">⟳</button>
</section>

<section id="tabs" class="tabs">
<button class="tab active" data-filter="Tutte">Tutte</button>
<button class="tab" data-filter="Tender">Tender</button>
<button class="tab" data-filter="Sales Support">Sales</button>
<button class="tab" data-filter="Eventi">Eventi</button>
</section>

<section class="stats">
<div class="stat"><div class="si">◫</div><div><div class="sl">Nuove</div><strong id="new">0</strong></div></div>
<div class="stat"><div class="si">★</div><div><div class="sl">Top</div><strong id="top">0</strong></div></div>
<div class="stat"><div class="si">⌁</div><div><div class="sl">Remote</div><strong id="remote">0</strong></div></div>
</section>

<section class="tools">
<label class="search">⌕ <input id="q" type="search" placeholder="Cerca azienda, ruolo, sede…"></label>
<div id="quick" class="quick">
<button class="mini" data-mini="Operations">Operations</button>
<button class="mini" data-mini="Remote">Remote</button>
<button class="mini" data-mini="Seguite">Seguite</button>
</div>
</section>

<div id="notice" class="notice"></div>
<section id="jobs" class="jobs"></section>

<nav class="nav">
<div class="navgrid">
<div class="navitem active"><span>◎</span><span>Home</span></div>
<div class="navitem"><span>⌕</span><span>Esplora</span></div>
<div class="navitem"><span>⌑</span><span>Salvati</span></div>
<div class="navitem"><span>◌</span><span>Profilo</span></div>
</div>
</nav>
<div class="footer">Alice Job Radar · aggiornamento automatico 08:00 / 15:00</div>
</main>

<script>
(()=>{"use strict";
const C=window.ALICE_RADAR_CONFIG||{dataUrl:"./data/jobs.json"};
const $=s=>document.querySelector(s),ui={jobs:$("#jobs"),q:$("#q"),tabs:$("#tabs"),quick:$("#quick"),updated:$("#updated"),refresh:$("#refresh"),notice:$("#notice"),n:$("#new"),t:$("#top"),r:$("#remote")};
let DATA=[],filter="Tutte",mini="";
const STATUS=["Nuova","Interessante","Candidata","Colloquio","Scartata"],KEY="alice-job-radar-status-v1";
const st=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}};
const gs=id=>st()[id]||"Nuova";
const ss=(id,v)=>{const s=st();s[id]=v;localStorage.setItem(KEY,JSON.stringify(s));render()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>(n||"AJ").replace(/S\.p\.A\.|Spa|Italia|Italy|Group|Office|Srl/gi,"").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"AJ";
const age=x=>{const t=Date.parse(x);return Number.isFinite(t)?(Date.now()-t)/36e5:999};
function counts(){const d=DATA.length?DATA.map(x=>x.date).sort().reverse()[0]:"";ui.n.textContent=DATA.filter(x=>x.date===d).length;ui.t.textContent=DATA.filter(x=>x.score>=9).length;ui.r.textContent=DATA.filter(x=>x.remote).length}
function ok(j){const q=ui.q.value.trim().toLowerCase();if(q&&![j.company,j.title,j.location,j.category,j.summary,j.salary,j.contract].join(" ").toLowerCase().includes(q))return false;if(filter!=="Tutte"&&j.category!==filter)return false;if(mini==="Remote"&&!j.remote)return false;if(mini==="Operations"&&j.category!=="Operations")return false;if(mini==="Seguite"&&["Nuova","Scartata"].includes(gs(j.id)))return false;return true}
function render(){counts();const a=DATA.filter(ok).sort((x,y)=>y.score-x.score||y.date.localeCompare(x.date));ui.jobs.innerHTML=a.length?a.map(j=>{const opts=STATUS.map(x=>'<option '+(x===gs(j.id)?'selected':'')+'>'+x+'</option>').join("");return '<article class="card '+(j.score>=9.5?'topmatch':'')+'"><div class="head"><div class="logo">'+esc(initials(j.company))+'</div><div class="info"><div class="company">'+esc(j.company)+'</div><div class="title">'+esc(j.title)+'</div><div class="loc">📍 '+esc(j.location)+'</div></div><div class="side"><div class="score"><b>★</b> '+Number(j.score).toFixed(1)+'</div><select class="status" data-id="'+esc(j.id)+'">'+opts+'</select></div></div><div class="meta"><span class="tag">'+esc(j.workMode||"Non indicato")+'</span><span class="tag">'+esc(j.salary||"Retribuzione n.d.")+'</span><span class="tag">'+esc(j.category)+'</span></div><div class="summary">'+esc(j.summary)+'</div>'+((j.checks||[]).length?'<div class="checks"><b>Da verificare:</b> '+esc(j.checks.join(" · "))+'</div>':'')+'<div class="bottom"><a class="open" href="'+esc(j.url)+'" target="_blank" rel="noopener">Apri annuncio →</a></div></article>'}).join(""):'<div class="card">Nessuna offerta con questi filtri.</div>';document.querySelectorAll(".status").forEach(e=>e.onchange=()=>ss(e.dataset.id,e.value))}
async function load(){ui.refresh.textContent="…";ui.notice.classList.remove("show");try{const r=await fetch(C.dataUrl+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();DATA=Array.isArray(j.jobs)?j.jobs:[];ui.updated.textContent="Ultimo aggiornamento: "+new Intl.DateTimeFormat("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(j.generatedAt));if(age(j.generatedAt)>36){ui.notice.textContent="La ricerca non risulta aggiornata nelle ultime 36 ore.";ui.notice.classList.add("show")}render()}catch(e){ui.notice.textContent="Non riesco a leggere i dati della ricerca.";ui.notice.classList.add("show")}ui.refresh.textContent="⟳"}
ui.q.oninput=render;ui.tabs.onclick=e=>{const b=e.target.closest(".tab");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()};ui.quick.onclick=e=>{const b=e.target.closest(".mini");if(!b)return;mini=mini===b.dataset.mini?"":b.dataset.mini;document.querySelectorAll(".mini").forEach(x=>x.classList.toggle("active",x.dataset.mini===mini));render()};ui.refresh.onclick=load;load();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
})();
</script>
</body></html>
