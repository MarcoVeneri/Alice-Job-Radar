<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alice Jobs">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Alice Job Radar</title>
<script src="./config.js"></script>
<style>
:root{--bg:#f3f5f8;--panel:rgba(255,255,255,.84);--solid:#fff;--ink:#101522;--muted:#737c8d;--line:rgba(108,122,145,.17);--accent:#6d5dfc;--green:#18a965;--amber:#e99427;--chip:#eef0f5;--shadow:0 14px 38px rgba(29,42,68,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--panel:rgba(25,29,38,.82);--solid:#171a21;--ink:#f5f7fb;--muted:#9aa4b5;--line:rgba(255,255,255,.10);--chip:#232833;--shadow:0 18px 45px rgba(0,0,0,.28)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 95% -10%,rgba(109,93,252,.17),transparent 28%),radial-gradient(circle at -5% 15%,rgba(92,181,255,.10),transparent 28%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:max(14px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.app{max-width:860px;margin:0 auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 2px 12px}.kicker{font-size:12px;font-weight:750;color:var(--muted)}h1{margin:3px 0 4px;font-size:34px;line-height:1;letter-spacing:-.045em}.sub{font-size:11px;color:var(--muted)}.refresh{width:45px;height:45px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:11px 12px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.stat strong{display:block;font-size:24px;line-height:1;font-weight:850;letter-spacing:-.04em}.stat span{display:block;font-size:9px;color:var(--muted);font-weight:750;margin-top:5px;text-transform:uppercase;letter-spacing:.06em}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:21px;padding:9px;box-shadow:var(--shadow);backdrop-filter:blur(20px);margin-bottom:10px}.search{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:13px;padding:0 10px;height:42px}.search input{border:0;background:transparent;color:var(--ink);outline:0;width:100%;font-size:15px}.filters{display:flex;gap:7px;overflow:auto;padding-top:8px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;cursor:pointer}.chip.active{background:var(--ink);color:var(--solid);border-color:var(--ink)}
.notice{display:none;margin-bottom:10px;padding:10px 12px;border:1px solid rgba(233,148,39,.25);background:rgba(233,148,39,.10);border-radius:14px;font-size:11px;color:var(--amber)}.notice.show{display:block}.jobs{display:grid;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:15px;box-shadow:var(--shadow);backdrop-filter:blur(22px)}.card.topmatch{border-color:rgba(109,93,252,.35);box-shadow:0 18px 42px rgba(109,93,252,.12)}.cardHead{display:flex;justify-content:space-between;gap:12px}.company{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.055em}.title{font-size:20px;font-weight:850;line-height:1.08;letter-spacing:-.025em;margin-top:3px}.score{flex:0 0 auto;min-width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#6d5dfc,#8b7cff);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.score strong{font-size:18px;line-height:1}.score span{font-size:8px;opacity:.85;margin-top:2px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{background:var(--chip);border-radius:999px;padding:6px 8px;font-size:9px;font-weight:750;color:var(--muted)}.tag.purple{background:rgba(109,93,252,.12);color:var(--accent)}.tag.green{background:rgba(24,169,101,.12);color:var(--green)}.summary{font-size:12px;line-height:1.42;color:var(--muted);margin-top:10px}.checks{font-size:10px;color:var(--muted);margin-top:8px}.checks b{color:var(--ink)}.cardBottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:12px}.statusSel{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:0 9px;font-size:11px;font-weight:780}.open{height:40px;border-radius:12px;border:0;background:var(--ink);color:var(--solid);font-weight:800;font-size:11px;padding:0 14px;text-decoration:none;display:flex;align-items:center;justify-content:center}.empty{background:var(--panel);border:1px dashed var(--line);border-radius:22px;padding:28px;text-align:center;color:var(--muted);font-size:13px}.footer{text-align:center;color:var(--muted);font-size:9px;margin-top:12px}
@media(max-width:620px){h1{font-size:30px}.stats{grid-template-columns:1fr 1fr}.card{border-radius:21px;padding:13px}.title{font-size:18px}.score{min-width:49px;height:49px;border-radius:14px}.cardBottom{grid-template-columns:1fr 104px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="kicker">Ricerca automatica · ogni giorno alle 08:00</div><h1>Alice Job Radar</h1><div id="updated" class="sub">Caricamento offerte…</div></div><button id="refresh" class="refresh" aria-label="Aggiorna">↻</button></header>
<section class="stats"><div class="stat"><strong id="stNew">0</strong><span>Nuove</span></div><div class="stat"><strong id="stHot">0</strong><span>≥ 9/10</span></div><div class="stat"><strong id="stRemote">0</strong><span>Remote</span></div><div class="stat"><strong id="stTracked">0</strong><span>Seguite</span></div></section>
<section class="toolbar"><div class="search">⌕ <input id="q" type="search" placeholder="Cerca azienda, ruolo, sede…"></div><div id="filters" class="filters"><button class="chip active" data-filter="Tutte">Tutte</button><button class="chip" data-filter="Tender">Tender / Bid</button><button class="chip" data-filter="Sales Support">Sales Support</button><button class="chip" data-filter="Eventi">Eventi</button><button class="chip" data-filter="Operations">Operations</button><button class="chip" data-filter="Remote">Remote</button><button class="chip" data-filter="Seguite">Seguite</button></div></section>
<div id="notice" class="notice"></div><section id="jobs" class="jobs"></section><div class="footer">Alice Job Radar · PWA v1.1 · stati salvati sul dispositivo</div>
</main>
<script>
(()=>{"use strict";const CFG=window.ALICE_RADAR_CONFIG||{dataUrl:"./data/jobs.json"};const $=s=>document.querySelector(s);const ui={jobs:$("#jobs"),q:$("#q"),filters:$("#filters"),updated:$("#updated"),refresh:$("#refresh"),notice:$("#notice"),stNew:$("#stNew"),stHot:$("#stHot"),stRemote:$("#stRemote"),stTracked:$("#stTracked")};let DATA=[],filter="Tutte";const STATUS=["Nuova","Interessante","Candidata","Colloquio","Scartata"],storeKey="alice-job-radar-status-v1";function state(){try{return JSON.parse(localStorage.getItem(storeKey)||"{}")}catch(e){return{}}}function saveState(s){try{localStorage.setItem(storeKey,JSON.stringify(s))}catch(e){}}function getStatus(id){return state()[id]||"Nuova"}function setStatus(id,v){const s=state();s[id]=v;saveState(s);render()}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function fmtDate(iso){try{return new Intl.DateTimeFormat("it-IT",{day:"numeric",month:"short"}).format(new Date(iso+"T12:00:00"))}catch(e){return iso}}function ageHours(iso){const t=Date.parse(iso);return Number.isFinite(t)?(Date.now()-t)/36e5:Infinity}
function counts(){const today=DATA.length?DATA.map(x=>x.date).sort().reverse()[0]:"";ui.stNew.textContent=DATA.filter(x=>x.date===today).length;ui.stHot.textContent=DATA.filter(x=>x.score>=9).length;ui.stRemote.textContent=DATA.filter(x=>x.remote).length;ui.stTracked.textContent=DATA.filter(x=>!["Nuova","Scartata"].includes(getStatus(x.id))).length}
function match(j){const q=ui.q.value.trim().toLowerCase();if(q&&![j.company,j.title,j.location,j.category,j.summary,j.salary].join(" ").toLowerCase().includes(q))return false;if(filter==="Tutte")return true;if(filter==="Remote")return !!j.remote;if(filter==="Seguite")return !["Nuova","Scartata"].includes(getStatus(j.id));return j.category===filter}
function render(){counts();const arr=DATA.filter(match).sort((a,b)=>b.score-a.score||b.date.localeCompare(a.date));if(!arr.length){ui.jobs.innerHTML='<div class="empty">Nessuna offerta con questi filtri.</div>';return}ui.jobs.innerHTML=arr.map(j=>{const st=getStatus(j.id),opts=STATUS.map(x=>'<option '+(x===st?"selected":"")+'>'+x+'</option>').join("");return '<article class="card '+(j.score>=9.5?"topmatch":"")+'"><div class="cardHead"><div><div class="company">'+esc(j.company)+' · '+fmtDate(j.date)+'</div><div class="title">'+esc(j.title)+'</div></div><div class="score"><strong>'+Number(j.score).toFixed(1)+'</strong><span>SU 10</span></div></div><div class="meta"><span class="tag purple">'+esc(j.category)+'</span><span class="tag">'+esc(j.location)+'</span><span class="tag '+(j.remote?"green":"")+'">'+esc(j.workMode)+'</span><span class="tag">'+esc(j.salary)+'</span></div><div class="summary">'+esc(j.summary)+'</div><div class="checks"><b>Da verificare:</b> '+esc((j.checks||[]).join(" · ")||"—")+'</div><div class="cardBottom"><select class="statusSel" data-id="'+esc(j.id)+'">'+opts+'</select><a class="open" href="'+esc(j.url)+'" target="_blank" rel="noopener">Apri annuncio</a></div></article>'}).join("");document.querySelectorAll(".statusSel").forEach(el=>el.addEventListener("change",e=>setStatus(e.target.dataset.id,e.target.value)))}
async function load(){ui.refresh.textContent="…";ui.notice.classList.remove("show");try{const r=await fetch(CFG.dataUrl+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const j=await r.json();DATA=Array.isArray(j.jobs)?j.jobs:[];const d=new Date(j.generatedAt);ui.updated.textContent="Aggiornato "+new Intl.DateTimeFormat("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(d)+" · "+DATA.length+" offerte";if(ageHours(j.generatedAt)>36){ui.notice.textContent="La ricerca non risulta aggiornata nelle ultime 36 ore.";ui.notice.classList.add("show")}render()}catch(e){ui.notice.textContent="Non riesco a leggere i dati della ricerca. Riprova con ↻.";ui.notice.classList.add("show")}ui.refresh.textContent="↻"}ui.q.addEventListener("input",render);ui.filters.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render()});ui.refresh.addEventListener("click",load);load();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))})();
</script></body></html>
