name: Alice Job Radar manual max-coverage refresh

on:
  push:
    branches: [main]
    paths:
      - 'fix-633.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alice-max-coverage-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified max-coverage refresh
        run: python scripts/fix_633.py
      - name: Commit refreshed run
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/source_catalog.json
          if git diff --cached --quiet; then
            echo "No max-coverage changes to commit"
            exit 0
          fi
          git commit -m "Refresh Alice 08:00 with max coverage"
          git push
