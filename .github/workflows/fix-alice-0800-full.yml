location":"Pistoia","workMode":"In presenza / non dichiarato","contract":"Tempo determinato finalizzato all'inserimento · CCNL Commercio 5° livello","salary":"22.000–24.000 €","category":"Sales Support","score":8.3,"source":"Ali Lavoro","url":"https://careers.alilavoro.it/job/view-job.php?id=88138-back-office-commerciale-pistoia&language=it","summary":"Inserimento e tracciamento ordini di acquisto e vendita, supporto alla migrazione SAP, rapporto con clienti e fornitori e gestione documentale.","checks":["RAL bassa rispetto alle priorità di Alice","Presenza richiesta anche il sabato mattina","Buon match operativo su ordini, SAP e back office"],"remote":false,"active":true}]''')
