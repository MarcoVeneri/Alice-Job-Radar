name: Fix Alice audit cards
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-alice-ui.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix_ui.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js config.js
          git commit -m "Simplify Alice audit status cards"
          git push
