name: Sanitize Alice Job Radar data

on:
  push:
    branches: [main]
    paths:
      - 'sanitize.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alice-jobs-sanitizer
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and sanitize jobs payload
        run: python scripts/sanitize_jobs.py
      - name: Commit sanitized data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No data normalization changes needed"
            exit 0
          fi
          git commit -m "Normalize Alice Job Radar data"
          git push
