name: Pubblica Alice Job Radar
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Alice Job Radar · Backup automatico"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Carica sito
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Verifica artefatto Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -Eq '^[0-9]+
        uses: actions/deploy-pages@v4
; then
              echo "Artefatto github-pages verificato."
              exit 0
            fi
            echo "Artefatto non ancora visibile, tentativo ${attempt}/5"
            sleep 5
          done
          echo "::error::Artefatto github-pages assente; deploy bloccato prima della pubblicazione"
          exit 1
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
