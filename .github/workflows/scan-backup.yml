name: Alice Job Radar · Backup automatico
on:
  schedule:
    # Covers Italy winter/summer time; the Python script chooses the local 09:30/15:30 slot.
    - cron: '30 7,8,13,14 * * *'
    # Recovery check at 10:05 / 16:05 Rome; skip when primary scan succeeded.
    - cron: '5 8,9,14,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scan_backup.py'
      - 'scripts/merge_scan_result.py'
      - 'scripts/jobsora_extract.py'
      - '.github/workflows/scan-backup.yml'

permissions:
  contents: write

concurrency:
  group: alice-job-radar-scan-backup
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python, data, and frontend JavaScript
        shell: bash
        run: |
          python -m py_compile scripts/scan_backup.py scripts/merge_scan_result.py
          python scripts/merge_scan_result.py --self-test
          python scripts/jobsora_extract.py --self-test
          python scripts/scan_backup.py --self-test
          python -m json.tool data/jobs.json >/dev/null
          node --check config.js
          node --check sw.js
          node --check audit-fix.js
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          doc = Path("index.html").read_text()
          chunks = re.findall(r'<script\b[^>]*>(.*?)</script>', doc, re.S | re.I)
          for i, js in enumerate(chunks):
              if js.strip():
                  path = Path(f"/tmp/alice-check-{i}.js")
                  path.write_text(js)
                  subprocess.run(["node", "--check", str(path)], check=True)
          print("Frontend scripts syntax OK")
          PY
      - name: Run national 20-region scan and public job feeds
        run: python scripts/scan_backup.py
      - name: Commit changed jobs only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No data change - source endpoints unavailable."
            exit 0
          fi
          git commit -m "Alice Radar national backup: verified 20-region search checkpoint"
          if git push origin HEAD:main; then
            echo "Scan published successfully on first attempt."
            exit 0
          fi
          cp data/jobs.json /tmp/alice-scan-result.json
          for attempt in 1 2 3; do
            echo "Concurrent update: preserve latest saved jobs and reapply scan (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_scan_result.py /tmp/alice-scan-result.json data/jobs.json
            git add data/jobs.json
            if git diff --cached --quiet; then
              echo "Latest branch already contains this scan."
              exit 0
            fi
            git commit -m "Alice Radar national backup: merge concurrent scan without dropping data"
            if git push origin HEAD:main; then
              echo "Concurrent scan successfully merged and published."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Failed to publish scan after three conflict-safe retries." >&2
          exit 1
