name: Alice Job Radar · Backup automatico
on:
  schedule:
    # Covers Italy winter/summer time; the Python script chooses the local 09:30/15:30 slot.
    - cron: '30 7,8,13,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scan_backup.py'
      - '.github/workflows/scan-backup.yml'

permissions:
  contents: write

concurrency:
  group: alice-job-radar-scan-backup
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python, data, and frontend JavaScript
        shell: bash
        run: |
          python -m py_compile scripts/scan_backup.py
          python -m json.tool data/jobs.json >/dev/null
          node --check config.js
          node --check sw.js
          node --check audit-fix.js
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          doc = Path("index.html").read_text()
          chunks = re.findall(r'<script\b[^>]*>(.*?)</script>', doc, re.S | re.I)
          for i, js in enumerate(chunks):
              if js.strip():
                  path = Path(f"/tmp/alice-check-{i}.js")
                  path.write_text(js)
                  subprocess.run(["node", "--check", str(path)], check=True)
          print("Frontend scripts syntax OK")
          PY
      - name: Run verified public feed fallback
        run: python scripts/scan_backup.py
      - name: Commit changed jobs only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No data change - source endpoints unavailable."
            exit 0
          fi
          git commit -m "Alice Job Radar backup: verified public feeds checkpoint"
          git push origin HEAD:main
