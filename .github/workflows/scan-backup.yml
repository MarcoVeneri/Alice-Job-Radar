name: Alice Job Radar · Backup automatico
on:
  schedule:
    # Recovery wake-ups every 10 minutes; Python scans only still-missing due slots.\n    # Validate current regression suite on every scanner change.
    # UTC range covers both CET and CEST, with exact-slot wake-ups as extra fallbacks.
    # GitHub scheduled runs are best-effort; later wake-ups recover skipped invocations.
    - cron: '7,17,27,37,47,57 7-21 * * *'
    - cron: '30 7,8,13,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scan_backup.py'
      - 'scripts/publish_scan.sh'
      - 'scripts/merge_scan_result.py'
      - 'scripts/jobsora_extract.py'
      - '.github/workflows/scan-backup.yml'

permissions:
  contents: write

concurrency:
  group: alice-job-radar-scan-backup
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python, data, and frontend JavaScript
        shell: bash
        run: |
          python -m py_compile scripts/scan_backup.py scripts/merge_scan_result.py
          python scripts/merge_scan_result.py --self-test
          python scripts/jobsora_extract.py --self-test
          python scripts/scan_backup.py --self-test
          python scripts/test_scan_recovery.py
          python -m json.tool data/jobs.json >/dev/null
          node --check config.js
          node --check sw.js
          node --check audit-fix.js
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          doc = Path("index.html").read_text()
          chunks = re.findall(r'<script\b[^>]*>(.*?)</script>', doc, re.S | re.I)
          for i, js in enumerate(chunks):
              if js.strip():
                  path = Path(f"/tmp/alice-check-{i}.js")
                  path.write_text(js)
                  subprocess.run(["node", "--check", str(path)], check=True)
          print("Frontend scripts syntax OK")
          PY
      - name: Register due slots before network work
        run: python scripts/scan_backup.py --prepare
      - name: Publish start checkpoint
        run: bash scripts/publish_scan.sh
      - name: Recover every due slot with national search and public feeds
        timeout-minutes: 14
        run: python scripts/scan_backup.py
      - name: Record interrupted scan honestly
        if: always()
        run: python scripts/scan_backup.py --record-failure
      - name: Publish final results preserving concurrent changes
        if: always()
        run: bash scripts/publish_scan.sh
      - name: Verify due-slot publication on remote main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          data = json.loads(subprocess.check_output(
              ["git", "show", "origin/main:data/jobs.json"], text=True))
          rome = datetime.now(ZoneInfo("Europe/Rome"))
          due = [s for s in ("09:30", "15:30")
                 if rome.hour * 60 + rome.minute >= int(s[:2]) * 60 + 30]
          audit = data.get("audit") or {}
          runs = audit.get("runs") or {} if audit.get("date") == rome.date().isoformat() else {}
          missing = [s for s in due if not isinstance(runs.get(s), dict)]
          if missing:
              raise SystemExit("Missing published scan slots: " + ", ".join(missing))
          for slot in due:
              print(f"Verified {slot} published status: {runs[slot].get('status')}; "
                    f"newJobs: {runs[slot].get('newJobs', 0)}")
          if not isinstance(data.get("jobs"), list):
              raise SystemExit("Published job catalogue missing")
          print("Publication verified; total job records:", len(data["jobs"]))
          PY
