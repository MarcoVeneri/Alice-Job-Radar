name: Alice Job Radar · Backup automatico
on:
  schedule:
    # Covers Italy winter/summer time; the Python script chooses the local 09:30/15:30 slot.
    - cron: '30 7,8,13,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scan_backup.py'
      - '.github/workflows/scan-backup.yml'

permissions:
  contents: write

concurrency:
  group: alice-job-radar-scan-backup
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run verified public feed fallback
        run: python scripts/scan_backup.py
      - name: Commit changed jobs only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No data change - source endpoints unavailable."
            exit 0
          fi
          git commit -m "Alice Job Radar backup: verified public feeds checkpoint"
          git push origin HEAD:main
