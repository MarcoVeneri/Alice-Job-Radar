name: Repair Alice audit counter

"on":
  push:
    paths:
      - "data/jobs.json"
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair invalid counters
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/jobs.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          changed = False
          for r in ((data.get('audit') or {}).get('runs') or {}).values():
              if not isinstance(r, dict):
                  continue
              total = int(r.get('requiredSourcesTotal') or 60)
              checked = int(r.get('requiredSourcesChecked') or 0)
              actual = len(dict.fromkeys(r.get('secondPassSources') or r.get('sourcesChecked') or []))
              if checked == 0 and actual > 0:
                  r['requiredSourcesChecked'] = min(total, actual)
                  r.setdefault('notes', []).append('Contatore audit autoriparato dalle fonti realmente registrate nel run.')
                  changed = True
          if changed:
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit if needed
        run: |
          git config user.name "MarcoVeneri"
          git config user.email "30596631+MarcoVeneri@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-repair Alice audit counters"
          git push
