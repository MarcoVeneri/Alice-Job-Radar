name: Fix Alice audit now

"on":
  push:
    paths:
      - ".github/workflows/fix-alice-1510.yml"
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair JSON counter
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/jobs.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          r = data['audit']['runs']['15:00']
          total = int(r.get('requiredSourcesTotal') or 60)
          actual = len(dict.fromkeys(r.get('secondPassSources') or r.get('sourcesChecked') or []))
          if int(r.get('requiredSourcesChecked') or 0) == 0 and actual > 0:
              r['requiredSourcesChecked'] = min(total, actual)
              r.setdefault('notes', []).append('Contatore corretto automaticamente usando le fonti realmente registrate nel run delle 15:00.')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "MarcoVeneri"
          git config user.email "30596631+MarcoVeneri@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Fix Alice 15 audit counter" || exit 0
          git push
