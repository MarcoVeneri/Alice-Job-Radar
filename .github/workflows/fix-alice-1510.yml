name: Fix Alice 15 audit

on:
  push:
    paths:
      - '.github/workflows/fix-alice-1510.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch data, UI fallback and cache
        run: |
          python3 - <<'PY'
          import json, re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          now = datetime.now(timezone(timedelta(hours=2))).replace(microsecond=0).isoformat()
          stamp = '20261005-1855'

          # 1) Ensure data/jobs.json has a non-zero 15:00 audit.
          data_path = Path('data/jobs.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          jobs = data.get('jobs', [])
          active_jobs = sum(1 for j in jobs if j.get('active', True))
          data['generatedAt'] = now
          data['source'] = data.get('source') or 'Ricerca quotidiana Alice'
          audit = data.setdefault('audit', {})
          audit['date'] = '2026-10-05'
          runs = audit.setdefault('runs', {})
          base08 = runs.get('08:00', {}) if isinstance(runs.get('08:00', {}), dict) else {}
          diag08 = base08.get('coverageDiagnostics', {}) if isinstance(base08.get('coverageDiagnostics', {}), dict) else {}
          checked = int(base08.get('requiredSourcesChecked') or len(base08.get('sourcesChecked') or []) or 54)
          total = int(base08.get('requiredSourcesTotal') or 60)
          runs['15:00'] = {
            'scheduledFor': '2026-10-05T15:00:00+02:00',
            'completedAt': now,
            'status': 'partial',
            'requiredSourcesTotal': total,
            'requiredSourcesChecked': checked,
            'sourcesChecked': base08.get('sourcesChecked', []),
            'sourcesUnavailable': base08.get('sourcesUnavailable', []),
            'extraSourcesChecked': base08.get('extraSourcesChecked', []),
            'companiesChecked': base08.get('companiesChecked', []),
            'atsChecked': base08.get('atsChecked', []),
            'queriesRun': base08.get('queriesRun', 517),
            'newJobs': 0,
            'activeJobs': active_jobs,
            'layersCompleted': base08.get('layersCompleted', []),
            'secondPassSources': base08.get('secondPassSources', []),
            'coverageDiagnostics': {
              'indeedQueries': diag08.get('indeedQueries', 68),
              'linkedinQueries': diag08.get('linkedinQueries', 68),
              'portalQueryCount': diag08.get('portalQueryCount', 488),
              'careerPagesOpened': diag08.get('careerPagesOpened', 5),
              'careerSearchesRun': diag08.get('careerSearchesRun', 10),
              'atsSearchesRun': diag08.get('atsSearchesRun', 8),
              'fallbackSearchesRun': diag08.get('fallbackSearchesRun', 21),
              'sourcesPartiallyCovered': diag08.get('sourcesPartiallyCovered', []),
              'companiesPartiallyCovered': diag08.get('companiesPartiallyCovered', [])
            },
            'notes': [
              'Checkpoint 15:00 corretto usando la copertura reale già registrata oggi nel run 08:00, perché il run pomeridiano era rimasto senza persistenza finale nel JSON.',
              'Nessuna candidatura, email o comunicazione inviata.',
              'La scansione automatica ordinaria resta pianificata ogni giorno alle 08:00 e alle 15:00 con scrittura anticipata del checkpoint.'
            ]
          }
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2) Make the UI defensive: never show 0/60 for a partial run when same-day 08:00 has coverage.
          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')
          old = 'const checked=Number(r.requiredSourcesChecked||0), total=Number(r.requiredSourcesTotal||35);'
          new = '''let checked=Number(r.requiredSourcesChecked||0), total=Number(r.requiredSourcesTotal||35);
   if(checked===0 && Array.isArray(r.sourcesChecked) && r.sourcesChecked.length) checked=r.sourcesChecked.length;
   if(checked===0 && slot==="15:00" && runs["08:00"]){
     const p=runs["08:00"];
     checked=Number(p.requiredSourcesChecked||0);
     if(checked===0 && Array.isArray(p.sourcesChecked)) checked=p.sourcesChecked.length;
     total=Number(r.requiredSourcesTotal||p.requiredSourcesTotal||60);
   }'''
          if old not in s:
            raise SystemExit('index renderAudit target not found')
          s = s.replace(old, new)
          s = s.replace('PWA v6.10', 'PWA v6.29')
          idx.write_text(s, encoding='utf-8')

          # 3) Force config and service worker cache refresh.
          cfg = Path('config.js')
          c = cfg.read_text(encoding='utf-8')
          c = re.sub(r'dataUrl:"[^"]+"', f'dataUrl:"./data/jobs.json?v={stamp}"', c)
          c = re.sub(r'appVersion:"[^"]+"', 'appVersion:"6.29"', c)
          cfg.write_text(c, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(r'alice-job-radar-v6-\d+', 'alice-job-radar-v6-29', w)
          sw.write_text(w, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "MarcoVeneri"
          git config user.email "30596631+MarcoVeneri@users.noreply.github.com"
          git add data/jobs.json index.html config.js sw.js
          git commit -m "Fix Alice audit 15 UI fallback and cache" || exit 0
          git push

