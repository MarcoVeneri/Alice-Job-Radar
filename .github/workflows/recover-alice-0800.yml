                  "existingJobPagesRechecked": 0,
                  "candidatePagesOpened": 11,
                  "closedJobsRemoved": 0
                },
                "notes": [
                  "Recupero manuale del run 08:00 dopo mancata persistenza del task automatico; marcato partial perché non equivale alla scansione completa delle 60 fonti.",
                  "Eseguite 30 ricerche/controlli reali mirati su back office, sales support, tender, order management, project/event coordination e aziende prioritarie.",
                  "Aggiunte solo offerte con pagina specifica verificabile e compatibilità ragionevole; esclusa Openjobmetis Campi Bisenzio per requisito vincolante di ottimo francese e GMG Prato per esperienza automotive obbligatoria.",
                  "Il run delle 15:00 resta da eseguire secondo la pianificazione ordinaria e dovrà ripartire dalla scansione profonda completa."
                ]
              }
            }
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Commit recupero 08:00
        run: |
          git config user.name "MarcoVeneri"
          git config user.email "30596631+MarcoVeneri@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Recupera Alice Job Radar - 2026-10-05 08:00" || exit 0
          git push
