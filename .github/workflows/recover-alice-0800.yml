            }
          ]

          new_count = 0
          for job in candidates:
            if job["id"] not in existing:
              jobs.append(job)
              existing.add(job["id"])
              new_count += 1

          active_count = sum(1 for j in jobs if j.get("active", True))
          data["generatedAt"] = now
          data["audit"] = {
            "date": "2026-10-05",
            "runs": {
              "08:00": {
                "scheduledFor": "2026-10-05T08:00:00+02:00",
                "completedAt": now,
                "status": "partial",
                "requiredSourcesTotal": 60,
                "requiredSourcesChecked": 4,
                "sourcesChecked": ["LinkedIn Jobs", "Randstad", "Ali Lavoro", "Openjobmetis"],
                "sourcesUnavailable": [],
                "extraSourcesChecked": ["Indeed indexed results", "Trovolavoro", "HelpLavoro", "Jooble", "Lavoro.it", "SimplyHired", "Avanade Careers", "Accenture Careers"],
                "companiesChecked": ["ABB E-mobility", "Avanade", "Accenture", "GMG", "PVH / Tommy Hilfiger", "AICOM", "PRAXI"],
                "atsChecked": [],
                "queriesRun": 30,
                "newJobs": new_count,
                "activeJobs": active_count,
                "layersCompleted": ["A) Portali generalisti - recupero parziale", "B) Agenzie - recupero parziale", "D) Career page target - recupero parziale", "F) Ricerche web domain-restricted", "G) Keyword operative e match semantico"],
                "secondPassSources": ["LinkedIn Jobs", "Randstad", "Openjobmetis"],
                "coverageDiagnostics": {
                  "indeedQueries": 3,
                  "linkedinQueries": 15,
                  "portalQueryCount": 30,
                  "careerPagesOpened": 4,
                  "careerSearchesRun": 9,
                  "atsSearchesRun": 0,
                  "fallbackSearchesRun": 6,
                  "sourcesPartiallyCovered": ["Indeed", "Avanade Careers", "Accenture Careers", "Trovolavoro", "HelpLavoro", "Jooble", "Lavoro.it", "SimplyHired"],
