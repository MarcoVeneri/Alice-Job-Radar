name: Recupera Alice 08:00
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/recover-alice-0800.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna jobs e audit 08:00
        shell: python
        run: |
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          p = Path("data/jobs.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          now = datetime.now(ZoneInfo("Europe/Rome")).isoformat(timespec="seconds")
          jobs = data.setdefault("jobs", [])
          existing = {j.get("id") for j in jobs}

          candidates = [
            {
              "id": "ali-lavoro-back-office-commerciale-pisa-4472588228",
              "date": "2026-10-03",
              "company": "Ali Lavoro / azienda cliente metalmeccanica",
              "title": "Impiegato / Impiegata Back Office Commerciale",
              "location": "Pisa",
              "workMode": "Non dichiarato",
              "contract": "CCNL Metalmeccanica Industria D1 · full time · temporaneo con possibile stabilizzazione",
              "salary": "1.600–2.000 € lordi/mese (indicazione da mirror; verificare in selezione)",
              "category": "Sales Support",
              "score": 9.2,
              "source": "Ali Lavoro / LinkedIn Jobs",
              "url": "https://it.linkedin.com/jobs/view/impiegato-impiegata-back-office-commerciale-at-ali-lavoro-4472588228",
              "summary": "Back office commerciale con preventivi, gestione clienti, avanzamento commesse, acquisti ricambi, gestionale, data entry e flussi documentali: forte sovrapposizione al profilo di Alice.",
              "checks": ["Sede Pisa", "Modalità ibrida non dichiarata", "Inquadramento D1; verificare RAL effettiva"],
              "remote": False,
              "active": True,
              "firstSeenAt": now,
              "firstSeenRun": "08:00"
            },
            {
              "id": "randstad-back-office-commerciale-arezzo-47367562",
              "date": "2026-09-01",
              "company": "Randstad Italia / azienda cliente",
              "title": "Back Office Commerciale (M/F/NB)",
              "location": "Arezzo",
              "workMode": "Non dichiarato",
              "contract": "Somministrazione · full time · CCNL Oreficeria",
              "salary": "21.000–28.000 €",
              "category": "Sales Support",
              "score": 9.4,
              "source": "Randstad",
              "url": "https://www.randstad.com/jobs/back-office-commerciale-mfnb_arezzo_47367562/",
              "summary": "Amministrazione vendite, assistenza clienti, SAP/CRM, ordini a fornitori, spedizioni, offerte e supporto a gare d'appalto. Annuncio ancora aperto con chiusura 8 ottobre 2026.",
              "checks": ["Buon inglese richiesto", "Esperienza import-export e SAP richiesta", "Modalità ibrida non dichiarata"],
              "remote": False,
              "active": True,
              "firstSeenAt": now,
              "firstSeenRun": "08:00"
            },
            {
              "id": "randstad-back-office-commerciale-estero-sansepolcro-47492862",
              "date": "2026-09-24",
              "company": "Randstad Italia / azienda cliente settore tessile",
              "title": "Back Office Commerciale Estero (F/M/NB)",
              "location": "Sansepolcro (AR)",
              "workMode": "Non dichiarato",
              "contract": "Inserimento diretto · full time; tipologia finale non dichiarata",
              "salary": "22.000–24.000 €",
              "category": "Sales Support",
              "score": 8.7,
              "source": "Randstad",
              "url": "https://www.randstad.com/jobs/back-office-commerciale-estero-fmnb_sansepolcro_47492862/",
              "summary": "Amministrazione vendite, customer service, ordini, scorte, consegne e coordinamento dei tecnici commerciali per offerte e gare d'appalto.",
              "checks": ["Buon inglese richiesto; tedesco plus", "Richiesti circa 5 anni nel ruolo", "RAL sotto 35k e sede Sansepolcro"],
              "remote": False,
              "active": True,
              "firstSeenAt": now,
              "firstSeenRun": "08:00"
            },
            {
              "id": "abb-e-mobility-team-lead-order-management-europe-4462935514",
              "date": "2026-10-05",
              "company": "ABB E-mobility",
              "title": "Team Lead Order Management Europe",
              "location": "San Giovanni Valdarno (AR)",
              "workMode": "Non dichiarato",
              "contract": "Full time · tipologia non dichiarata",
              "salary": "Non dichiarato",
              "category": "Operations",
              "score": 7.8,
              "source": "ABB E-mobility / LinkedIn Jobs",
